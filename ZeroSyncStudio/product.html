<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Product Viewer | ZeroSync Studio</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>

<body>
    <nav class="navbar">
        <div class="logo"><a href="index.html">ZeroSync</a></div>
        <div class="nav-links">
            <a href="index.html">Back to Home</a>
        </div>
    </nav>

    <div class="viewer-container">
        <div id="product-canvas-container" class="fullscreen-canvas"></div>

        <div class="controls">
            <h2>Cyber Hoodie</h2>
            <div class="color-options">
                <button class="color-btn black selected" data-color="0x111111"
                    onclick="changeColor(0x111111)">Black</button>
                <button class="color-btn white" data-color="0xffffff" onclick="changeColor(0xffffff)">White</button>
                <button class="color-btn beige" data-color="0xf5f5dc" onclick="changeColor(0xf5f5dc)">Beige</button>
            </div>
            <div class="instructions">
                <p>Drag to Rotate • Scroll to Zoom • Right Click to Pan</p>
            </div>
        </div>
    </div>

    <!-- OrbitControls CDN (Needed for product viewer interaction) -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="three-handler.js"></script>
    <script src="script.js"></script>
</body>

</html>
