<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Viewer | ZeroSync Studio</title>
    <link rel="stylesheet" href="style.css">

    <!-- Dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <!-- OrbitControls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="viewer-body">
    <div class="cursor"></div>
    <div class="cursor-follower"></div>

    <div class="viewer-container">
        <div id="product-canvas"></div>

        <div class="product-ui">
            <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Shop</a>

            <div class="product-details">
                <h1>CYBER HOODIE V1</h1>
                <p>Oversized fit. Heavyweight cotton. Neural-link interface ready.</p>
                <div class="price">$89.00</div>
                <button class="btn primary-btn" style="width: 100%; margin-top: 1rem;">Add to Cart</button>
            </div>

            <div class="controls">
                <div class="color-picker">
                    <div class="color-btn active" style="background: #111;" data-color="0x111111"></div> <!-- Black -->
                    <div class="color-btn" style="background: #f0f0f0;" data-color="0xf0f0f0"></div>
                    <!-- White/Off-white -->
                    <div class="color-btn" style="background: #d2b48c;" data-color="0xd2b48c"></div> <!-- Beige -->
                </div>
                <div class="zoom-controls">
                    <button class="action-btn" id="rotate-btn"><i class="fas fa-sync-alt"></i></button>
                </div>
            </div>
        </div>
    </div>

    <script src="product-viewer.js"></script>
</body>

</html>
